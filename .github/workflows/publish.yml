name: Publish

on:
  # This allows us to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      version-strategy:
        type: choice
        description: 'Version strategy'
        required: true
        options:
            - 'patch'
            - 'minor'
            - 'major'
        default: patch
      title:
        type: string
        description: 'Release title'
        required: true

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  update_package_version:
    name: Update package version
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack about new release
        uses: ravsamhq/notify-slack-action@be814b201e233b2dc673608aa46e5447c8ab13f2 # 2.5.0
        with:
          notification_title: "⏳ Starting new constructorio-ui-asa deployment"
          status: ${{ job.status }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - uses: actions/checkout@v5

      - uses: oleksiyrudenko/gha-git-credentials@a21f1c60b063ff04da21033f2578ca7a5cd8804f # v2.1.2
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'

      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Get latest release
        id: last-release
        uses: pozetroninc/github-action-get-latest-release@2a61c339ea7ef0a336d1daa35ef0cb1418e7676c # v0.8.0
        with:
          repository: ${{ github.repository }}
          excludes: "prerelease, draft"
          token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Create new git tag
        uses: "./.github/actions/create-version-tag"
        id: tag
        with:
          last-version: ${{ steps.last-release.outputs.release }}
          version-strategy: ${{ inputs.version-strategy }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

    outputs:
        version: ${{ steps.tag.outputs.next-version }}

  create_github_release:
    name: Create GitHub release
    needs: update_package_version
    uses: ./.github/workflows/create-github-release.yml
    with:
      version: ${{ needs.update_package_version.outputs.version }}
      title: ${{ github.event.inputs.title }}
    secrets: inherit

  publish_to_npm:
    name: Publish to NPM
    needs: [create_github_release, update_package_version]
    uses: ./.github/workflows/publish-npm.yml
    with:
      version: ${{ needs.update_package_version.outputs.version }}
    secrets: inherit

  publish_to_cdn:
    name: Publish to CDN
    needs: [publish_to_npm, update_package_version]
    uses: ./.github/workflows/publish-cdn.yml
    with:
      version: ${{ needs.update_package_version.outputs.version }}
    secrets: inherit

  deploy_storybook:
    needs: publish_to_npm
    name: Deploy Storybook
    uses: ./.github/workflows/deploy-storybook.yml

  final_deployment_notification:
    name: Final deployment notification
    runs-on: ubuntu-latest
    if: always()
    needs: [
      create_github_release,
      publish_to_npm,
      publish_to_cdn,
      update_package_version,
      deploy_storybook
    ]
    steps:
      - name: Get workflow conclusion
        id: workflow-conclusion
        uses: technote-space/workflow-conclusion-action@45ce8e0eb155657ab8ccf346ade734257fd196a5 # v3.0.3
        with:
          STRICT_SUCCESS: true

      - name: Report deployment status to Slack
        uses: ravsamhq/notify-slack-action@be814b201e233b2dc673608aa46e5447c8ab13f2 # 2.5.0
        with:
          notification_title: "🏁 Constructorio-ui-asa deployment completed"
          status: ${{ steps.workflow-conclusion.outputs.conclusion }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
