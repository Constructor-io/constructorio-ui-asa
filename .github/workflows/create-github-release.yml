name: 'Publish: Create GitHub release'

# We need these permissions create new GitHub releases
permissions: write-all

on:
  workflow_call:
    inputs:
      version:
        type: string
        description: 'Version to publish'
        required: true
      title:
        type: string
        description: 'Release title'
        required: true

  # This workflow is intended to be called from the primary publish workflow
  # automatically. The manual trigger is maintained for partially failed workflows
  # or edge cases that require this be run independently.
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'Version to publish'
        required: true
      title:
        type: string
        description: 'Release title'
        required: true

jobs:
  create-github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          name: ${{ inputs.title }}
          tag: ${{ inputs.version }}
          token: ${{ github.token }}
          generateReleaseNotes: true

      - name: Notify Slack about successful release
        uses: ravsamhq/notify-slack-action@be814b201e233b2dc673608aa46e5447c8ab13f2 # 2.5.0
        with:
          notification_title: "😸 New constructorio-ui-asa GitHub release created at version ${{ inputs.version }}"
          status: ${{ job.status }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
