name: Run Diffend

on:
  pull_request:
    branches:
      - '**'
concurrency:
  group: run-diffend-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  diffend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Set up node
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.x
      - name: Install npm 11
        run: npm install -g npm@11
      - name: Install Diffend (Mend)
        run: npm install -g https://my.diffend.io/releases/npm/stable.tgz && sh ./bin/patch-diffend
      - name: Install dependencies with Diffend
        run: diffend npm install
